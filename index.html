<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>札幌クールスポットマップ MVP</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQn+H8YfHk4h9g3gJp5sVqZ9n1lvSw="
      crossorigin=""
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" id="intro" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Sapporo Cool Spot Map</p>
          <h1 id="app-title">近くの涼める場所とトイレを探す</h1>
          <p class="lead">
            暑い日の外出中に、休める場所とトイレをすばやく確認するための地図です。
          </p>
        </div>
        <div class="intro-actions" aria-label="地図の表示方法">
          <button class="primary-button" id="use-location" type="button">
            現在地を使って表示
          </button>
          <button class="secondary-button" id="use-sapporo" type="button">
            札幌中心部で表示
          </button>
        </div>
        <p class="status" id="status" role="status">
          位置情報はブラウザの許可後にだけ取得します。
        </p>
      </section>

      <section class="map-panel" id="map-panel" aria-label="地図" hidden>
        <header class="toolbar">
          <div>
            <p class="eyebrow">OpenStreetMap</p>
            <h2 id="map-title">札幌周辺</h2>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button" id="recenter" type="button" title="現在地へ戻る" aria-label="現在地へ戻る">
              ◎
            </button>
            <button class="secondary-button compact" id="reload-spots" type="button">
              データ再読込
            </button>
          </div>
        </header>
        <div class="map-layout">
          <div id="map" class="map" aria-label="現在地周辺の地図"></div>
          <aside class="spot-list" aria-labelledby="spots-title">
            <div class="spot-list-header">
              <h2 id="spots-title">オーバーレイ</h2>
              <span id="spot-count">0件</span>
            </div>
            <div class="filter-row" aria-label="表示する施設">
              <label>
                <input type="checkbox" id="filter-cool" checked />
                涼める場所
              </label>
              <label>
                <input type="checkbox" id="filter-toilet" checked />
                トイレ
              </label>
            </div>
            <ol id="spots" class="spots"></ol>
            <p class="note" id="data-note">
              施設データを読み込んでいます。
            </p>
          </aside>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./src/app.js" type="module"></script>
  </body>
</html>
