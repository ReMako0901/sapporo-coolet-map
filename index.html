<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>札幌クールスポットマップ MVP</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css?v=20260710-7" />
    <link rel="stylesheet" href="./src/style.css?v=20260710-7" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" id="map-panel" aria-label="地図">
        <header class="app-header">
          <div>
            <p class="eyebrow">Sapporo Cool Spot</p>
            <h1 id="app-title">涼みどころ</h1>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="locate" type="button" title="現在地を取得" aria-label="現在地を取得">
              ⦿
            </button>
            <button class="secondary-button compact" id="reload-spots" type="button">
              更新
            </button>
          </div>
        </header>

        <p class="status" id="status" role="status">札幌中心部を表示しています。</p>

        <div class="map-layout">
          <div id="map" class="map" aria-label="現在地周辺の地図"></div>
          <aside class="spot-panel" aria-labelledby="spots-title">
            <div class="spot-list-header">
              <h2 id="spots-title">近くの候補</h2>
              <span id="spot-count">0件</span>
            </div>
            <div class="filter-row" aria-label="表示する施設">
              <label>
                <input type="checkbox" id="filter-cool" checked />
                涼める場所
              </label>
              <label>
                <input type="checkbox" id="filter-toilet" checked />
                トイレ
              </label>
            </div>
            <ol id="spots" class="spots"></ol>
            <p class="note" id="data-note">
              施設データを読み込んでいます。
            </p>
          </aside>
        </div>
      </section>

      <dialog class="location-dialog" id="location-dialog" aria-labelledby="location-title">
        <form method="dialog" class="dialog-card">
          <p class="eyebrow">現在地の利用</p>
          <h2 id="location-title">今いる場所から探す？</h2>
          <p class="dialog-copy">
            許可すると現在地を中心に地図を表示します。拒否しても札幌中心部から使えます。
          </p>
          <div class="dialog-actions">
            <button class="primary-button" id="use-location" type="button">
              現在地を使う
            </button>
            <button class="secondary-button" id="use-sapporo" type="button">
              使わない
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="./vendor/leaflet/leaflet.js?v=20260710-7"></script>
    <script src="./src/app.js?v=20260710-8" type="module"></script>
  </body>
</html>
